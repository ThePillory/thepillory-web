<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Pillory</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 4rem 1.5rem;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;

        font-size: 1.1rem;

      ul {
        margin: 2rem 0;
        padding-left: 1.25rem;
      }

      li {
        margin-bottom: 0.75rem;

        color: #4b5563;
        font-style: italic;
        margin-top: 2.5rem;

  <body>
    <div class="container">
      <h1>The Pillory</h1>

      <p><strong>A fact-based civic accountability platform.</strong></p>

      <ul>

        <li><strong>Evidence-first posts and corroboration</strong></li>
        <li><strong>Private aggregation → public accountability</strong></li>

      <p class="muted">
