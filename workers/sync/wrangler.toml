# Sync Worker: loads officials and voting records into D1 on a daily schedule,
# then drafts constitutional analyses of new bills for people to review.
# Deploy from this folder (Cloudflare dashboard → Workers → import this repo,
# root directory "workers/sync"), or locally with `npx wrangler deploy`.
# Setup steps: docs/data-sync.md

name = "pillory-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Serve the Worker on its workers.dev URL, which the manual /run and /status links use.
workers_dev = true
# Keep variables set in the Cloudflare dashboard when this file is deployed
# (each deploy otherwise replaces them with [vars] below). Secrets are always kept.
keep_vars = true

# Import .sql migration files as text so the Worker can apply them itself.
rules = [{ type = "Text", globs = ["**/*.sql"], fallthrough = true }]

[triggers]
# Daily at 11:00 UTC (4 a.m. Pacific daylight time).
crons = ["0 11 * * *"]

# Runs happen in the background inside this Durable Object (see src/index.js),
# so /run can answer immediately. Created automatically on deploy.
[[durable_objects.bindings]]
name = "SYNC_RUNNER"
class_name = "SyncRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRunner"]

# Workers Paid: allow up to 5 minutes of CPU per invocation (a run mostly waits
# on the network, so this is headroom, not an expectation).
[limits]
cpu_ms = 300000

[[d1_databases]]
binding = "DB"
database_name = "pillory"
# Replace with the ID shown in Cloudflare → Storage & Databases → D1 → pillory.
database_id = "b6afd5de-4804-4c2b-bb14-af4314190e9d"
migrations_dir = "migrations"

[vars]
# Where data/county-officials.json is published.
SITE_URL = "https://thepillory.co"
# A point inside Calaveras County (San Andreas, the county seat), used to look
# up which state and federal districts cover the county.
LOOKUP_LAT = "38.1960"
LOOKUP_LNG = "-120.6805"
# Optional override for the U.S. House district number (e.g. "5"). Leave blank
# to detect it from the Open States lookup above.
CA_HOUSE_DISTRICT = "5"
# Optional: California session identifier, e.g. "20252026". Leave blank to use
# the current regular session (two-year sessions starting in odd years).
CA_SESSION = ""
# Outbound requests allowed per run. Workers Free allows 50 per invocation;
# on Workers Paid you can raise this (e.g. to 900) to backfill much faster.
MAX_SUBREQUESTS = "900"
# Open States free tier: stay well under the daily limit and ~10 requests/min.
OPENSTATES_DAILY_LIMIT = "250"
# Kept each day for loading state legislators while their weekly load is due.
OPENSTATES_OFFICIALS_RESERVE = "10"
OPENSTATES_MIN_INTERVAL_MS = "6500"
# AI-drafted constitutional analysis (src/analysis/). At most this many drafts a
# day; each costs one Claude API call. Set to "0" to pause drafting.
ANALYSIS_DAILY_LIMIT = "5"
ANALYSIS_MODEL = "claude-sonnet-5-5"
ANALYSIS_EFFORT = "high"
# Longer bill texts are cut to this many characters and the draft is marked "limited".
MAX_BILL_TEXT_CHARS = "400000"
# A short card of a bill longer than this is drafted (and reviewed) from the
# official summary, the list of sections and the opening text, so a 500-page
# bill isn't read in full twice. Full analyses still read the whole text.
CARD_TEXT_CHARS = "60000"
# When the AI reviewer flags a draft, the drafter revises it this many times
# (each revision is reviewed again) before it goes to the review queue.
REVISIONS_PER_DRAFT = "1"
# Agenda watch: plain-language summaries of county agendas. Separate daily cap
# from bill analyses (each agenda is one Claude API call).
AGENDA_DAILY_LIMIT = "3"
# Topics: items tagged per day (bills, agenda items, executive actions, Platform excerpts), in batches of 25. See docs/topics.md.
TOPIC_DAILY_LIMIT = "500"
# Review load (docs/analysis.md): the relevance check (claude-haiku-4-5) runs on
# titles before drafting; the AI reviewer (claude-sonnet-5-5) checks every draft.
REVIEW_EFFORT = "medium"
# Share of drafts the AI reviewer passes that also go to the review queue as spot checks.
SPOT_CHECK_RATE = "0.1"
# Earlier drafts reviewed per day by the AI reviewer (drafts written before it
# existed, whose review failed, or that were flagged under earlier rules).
REVIEW_BACKLOG_DAILY = "30"
# County meetings (src/meetings/county.js). The county moved to Tyler Meeting
# Manager in September 2026; "tylermm|iqm2" would also read the old IQM2 portal.
COUNTY_MEETING_SOURCES = "tylermm"
MEETING_BODIES = "Board of Supervisors|Planning Commission"
TYLERMM_MIN_INTERVAL_MS = "10000"
TYLERMM_DAILY_LIMIT = "20"
TYLERMM_PDF_MAX_BYTES = "26214400"
# The old IQM2 portal's robots.txt asks for 60 seconds between requests.
IQM2_MIN_INTERVAL_MS = "60000"
IQM2_DAILY_LIMIT = "12"
# Campaign funding (FEC; src/funding/). An api.data.gov key allows 1,000 FEC
# requests an hour: one every 4 seconds stays under it. Funding uses its own key
# (secret FEC_API_KEY), so it doesn't share an hourly limit with the votes steps;
# without it, it borrows CONGRESS_API_KEY at half the pace.
FEC_MIN_INTERVAL_MS = "4000"
FEC_SHARED_MIN_INTERVAL_MS = "8000"
# Funding loads these House districts' members first (the live communities; keep
# in step with LIVE in functions/_lib/geo.js), with their state's senators, then
# the rest of those states' delegations, then everyone else.
LIVE_HOUSE_DISTRICTS = "CA-5"
# While lobbying has bills waiting, funding leaves it this share of each round.
LOBBYING_ROUND_SHARE = "0.4"
FEC_DAILY_LIMIT = "3000"
FUNDING_REFRESH_DAYS = "7"
# Lobbying reports (lda.gov; no key needed, LDA_API_KEY optional).
LDA_MIN_INTERVAL_MS = "3000"
LDA_DAILY_LIMIT = "1200"
LOBBYING_REFRESH_DAYS = "30"
# The executive branch (src/executive/; docs/executive.md). The Governor's site
# and leginfo have no API: one request every 2 seconds, capped per day.
GOVCA_MIN_INTERVAL_MS = "2000"
GOVCA_DAILY_LIMIT = "300"
LEGINFO_MIN_INTERVAL_MS = "2000"
LEGINFO_DAILY_LIMIT = "1500"
# Meetings from this many days back are read once (agenda and agenda watch), so
# recent agendas are filled in even when no new meetings are posted.
MEETING_BACKFILL_DAYS = "30"

# Secrets (set with `npx wrangler secret put NAME` or in the dashboard):
#   CONGRESS_API_KEY    api.congress.gov key
#   OPENSTATES_API_KEY  v3.openstates.org key
#   SYNC_TOKEN          any long random string; required to run the sync manually
#   ANTHROPIC_API_KEY   Claude API key, for drafting analyses (without it that step is skipped)
#   COURTLISTENER_API_TOKEN  courtlistener.com API token, for checking case citations
