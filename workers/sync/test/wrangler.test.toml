# Local test config: same Worker, pointed at the FAKE fixture server.
# Used by run-local.sh; never deployed.
name = "pillory-sync-test"
main = "../src/index.js"
compatibility_date = "2025-09-01"
rules = [{ type = "Text", globs = ["**/*.sql"], fallthrough = true }]

# Runs happen in the background inside this Durable Object (see src/index.js),
# so /run can answer immediately. Created automatically on deploy.
[[durable_objects.bindings]]
name = "SYNC_RUNNER"
class_name = "SyncRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncRunner"]

[[d1_databases]]
binding = "DB"
database_name = "pillory-local-test"
database_id = "pillory-local-test"
migrations_dir = "../migrations"

[vars]
SITE_URL = "http://127.0.0.1:8788/site"
CONGRESS_API_BASE = "http://127.0.0.1:8788/congress"
OPENSTATES_API_BASE = "http://127.0.0.1:8788/openstates"
SENATE_BASE = "http://127.0.0.1:8788/senate"
LOOKUP_LAT = "38.1960"
LOOKUP_LNG = "-120.6805"
CA_HOUSE_DISTRICT = ""
MAX_SUBREQUESTS = "45"
OPENSTATES_DAILY_LIMIT = "250"
OPENSTATES_MIN_INTERVAL_MS = "0"
CONGRESS_API_KEY = "fake-key"
OPENSTATES_API_KEY = "fake-key"
SYNC_TOKEN = "local-test-token"
ANTHROPIC_BASE_URL = "http://127.0.0.1:8788/anthropic"
ANTHROPIC_API_KEY = "fake-anthropic-key"
COURTLISTENER_BASE = "http://127.0.0.1:8788/courtlistener"
COURTLISTENER_API_TOKEN = "fake-courtlistener-token"
LEGINFO_BASE = "http://127.0.0.1:8788/leginfo"
ANALYSIS_DAILY_LIMIT = "20"
ANALYSIS_MODEL = "claude-sonnet-5-5"
ANALYSIS_EFFORT = "high"
AGENDA_DAILY_LIMIT = "3"
REVIEW_EFFORT = "medium"
# Every pass is a spot check in tests, so the spot-check queue has entries.
SPOT_CHECK_RATE = "1"
REVIEW_BACKLOG_DAILY = "10"
IQM2_BASE = "http://127.0.0.1:8788/iqm2"
IQM2_MIN_INTERVAL_MS = "0"
IQM2_DAILY_LIMIT = "20"
# Meetings from this many days back are read once (agenda and agenda watch), so
# recent agendas are filled in even when no new meetings are posted.
MEETING_BACKFILL_DAYS = "30"
MEETING_BODIES = "Board of Supervisors|Planning Commission"
# The fixtures list a handful of members, not ~540 and ~120.
MIN_FEDERAL_MEMBERS = "1"
MIN_STATE_LEGISLATORS = "1"
# Small, so the fixtures' H.R. 20 counts as a long bill and its card is condensed.
CARD_TEXT_CHARS = "300"
