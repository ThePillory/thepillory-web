# TEMPORARY: measure Open States bulk files and Census district names (removed before merge).
name: TEMPORARY research probe
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-research.yml, tmp-research/probe.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tmp-research/probe.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-research/out
          git commit -m "TEMPORARY: research probe output"
          git pull --rebase -q origin claude/pillory-mobile-screens-p5zekn || true
          git push
