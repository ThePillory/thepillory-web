# TEMPORARY: research probe (FEC election dates). Remove before merge.
name: TEMPORARY research probe
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-research.yml, tools/build_federal_races.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          python3 tools/build_federal_races.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/elections
          git commit -m "TEMPORARY: election dates from the FEC (probe run)" && git push
