# TEMPORARY: research probe for Washington's ballot measures. Remove before merge.
name: TEMPORARY research probe
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tmp-research/probe_wa.py, .github/workflows/tmp-research.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python3 tmp-research/probe_wa.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add tmp-research/out-wa
          git commit -m "TEMPORARY: Washington probe output" && git push
