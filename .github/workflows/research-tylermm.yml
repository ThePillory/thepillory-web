# TEMPORARY: record real Tyler Meeting Manager responses. Removed before merge.
name: Research Tyler Meeting Manager
on:
  push:
    paths: [".github/workflows/research-tylermm.yml", "tools/research_tylermm.mjs"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/research_tylermm.mjs
