# Temporary: checks which disclosure sites GitHub's servers can reach and saves samples. Removed after use.
name: Probe disclosure sites
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/probe/disclosures.py, .github/workflows/probe-disclosures.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 -m pip install -q pdfplumber==0.11.4
      - run: python3 tools/probe/disclosures.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/probe/out
          git commit -m "Probe samples" && git push || true
