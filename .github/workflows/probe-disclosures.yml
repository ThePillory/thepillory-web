# Temporary: checks which disclosure sites GitHub's servers can reach. Removed after one run.
name: Probe disclosure sites
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/probe/disclosures.py, .github/workflows/probe-disclosures.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 tools/probe/disclosures.py
