# Builds data/ca-constitution.json, the California Constitution word for word
# from California Legislative Information (tools/build_ca_constitution.py).
# Weekly, so amendments voters approve show up; when the builder changes; and on demand (Actions ->
# California Constitution -> Run workflow; "probe" prints the first rows).
name: California Constitution
on:
  push:
    paths: ["tools/build_ca_constitution.py", ".github/workflows/ca-constitution.yml"]
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "build, or probe (print the first rows and one section, write nothing)"
        default: "build"
permissions:
  contents: write
# One at a time with every other workflow that commits data (tools/commit_data.sh).
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        if: github.event.inputs.mode == 'probe'
        run: python3 tools/build_ca_constitution.py --probe
      - name: Build from leginfo
        if: github.event.inputs.mode != 'probe'
        run: python3 tools/build_ca_constitution.py
      - name: The first rows and one section, for fixing the reader
        if: failure()
        run: python3 tools/build_ca_constitution.py --probe
      - name: Commit the text
        if: github.event.inputs.mode != 'probe'
        run: bash tools/commit_data.sh "Refresh the California Constitution from California Legislative Information" data/ca-constitution.json
