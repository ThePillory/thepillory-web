# TEMPORARY: run the new California build on the real export, and check FPPC for legislators. Removed before merge.
name: TEMPORARY California funding research
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-ca-research.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: FPPC legislators
        run: |
          for n in Tangipa Alvarado-Gil Newsom; do
            curl -s -X POST -H "Content-Type: application/json" -H "Accept: application/json" -d "{\"searchFieldQueryInfos\":[{\"queryField\":\"FilerLastName\",\"queryType\":\"Exact Match\",\"filterValue\":\"$n\"}],\"showOnlyHeldPositions\":false}" https://form700search.fppc.ca.gov/Home/SearchDocuments > /tmp/f.json
            python3 - <<'PY'
          import json
          d=json.loads(open('/tmp/f.json').read())
          if isinstance(d,str): d=json.loads(d)
          docs=d.get('documents') or []
          print('documents', len(docs))
          for x in docs[:8]:
              f=x.get('filer',{}); print(' ', f.get('firstName'), f.get('lastName'), [(p.get('agency'), p.get('position'), p.get('filingType'), p.get('filingYear')) for p in x.get('filingPositions',[])], (x.get('filingInfo') or {}).get('filedDate'))
          PY
          done
      - name: Build
        run: |
          time python3 tools/build_ca_campaign.py /tmp/cabuild
          time node tools/ca_campaign_finish.mjs /tmp/cabuild/ca-campaign-raw.json /tmp/cabuild/ca-campaign.json
          ls -la /tmp/cabuild/
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cabuild/ca-campaign.json'))
          def show(label, p):
              print('==', label, p['name'], [c['name'] for c in p['committees']])
              for cyc, c in p['cycles'].items():
                  print('  ', cyc, 'raised', c['raised'], 'spent', c['spent'], 'statements', c['statements'], 'individuals', c['individuals'], 'not_employed', c['not_employed'])
                  print('     industries', c['industries'][:6])
                  print('     employers', c['employers'][:5])
                  print('     organizations', [(o['name'], o['kind'], o['industry'], o['total']) for o in c['organizations'][:6]])
                  print('     ie', [(x['spender'], x['support_oppose'], x['race'], x['total'], x['filings']) for x in c['ie'][:8]])
          show('governor', d['officials']['governor'])
          show('lt gov', d['officials']['lieutenant-governor'])
          for seat in ('ASM-8', 'SEN-4'):
              for p in d['seats'].get(seat, []): show(seat, p)
          print('seats', len(d['seats']), 'candidates', sum(len(v) for v in d['seats'].values()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ca-campaign
          path: /tmp/cabuild/ca-campaign.json
          retention-days: 3
