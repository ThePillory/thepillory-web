# Temporary: runs tools/load_ca_lobbying.py in measure mode on the real export. Removed after use.
name: Probe California lobbying (measure)
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/load_ca_lobbying.py, tools/ca_lobbying.py, .github/workflows/probe-calobby.yml]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL -o /tmp/cal.zip https://campaignfinance.cdn.sos.ca.gov/dbwebexport.zip
      - run: python3 tools/load_ca_lobbying.py /tmp/cal.zip --mode measure
