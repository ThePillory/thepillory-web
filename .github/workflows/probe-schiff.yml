# Temporary: screenshots Adam Schiff's Stock trades section on the PR preview at phone width. Removed after use.
name: Probe Schiff trades (phone)
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/probe/schiff.mjs, .github/workflows/probe-schiff.yml]
permissions:
  contents: write
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: |
          for i in $(seq 1 30); do code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/reps/"); [ "$code" = 200 ] && break; sleep 20; done
          node tools/probe/schiff.mjs "$BASE"
        env:
          BASE: https://1af4df4d.thepillory-web.pages.dev
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/probe/out
          git commit -m "Probe samples" && for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done || true
