# Reads 501(c)(4) and 501(c)(6) nonprofits' political spending, as filed on
# Schedule C of their IRS Form 990, from the IRS's e-file XML into D1, weekly and
# on demand (Actions -> Refresh nonprofit filings -> Run workflow). The sync
# Worker's dark-money step finds which nonprofits to read. See
# tools/load_nonprofits.py and docs/funding.md.
name: Refresh nonprofit filings
on:
  schedule:
    - cron: "41 15 * * 2"  # Tuesdays
  workflow_dispatch:
    inputs:
      mode:
        description: "measure (read, write nothing) or load"
        default: load
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install -q zipfile-deflate64==0.2.0
      - run: python3 tools/load_nonprofits.py --mode "${{ github.event.inputs.mode || 'load' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
