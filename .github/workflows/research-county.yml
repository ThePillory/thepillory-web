# TEMPORARY: fetches Calaveras County pages from a GitHub runner (the dev
# sandbox can't reach them) and prints them, to see what the county publishes.
# Removed before the PR is merged.
name: Research county pages
on:
  push:
    paths: [".github/workflows/research-county.yml", "tools/research_county.py"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/research_county.py
