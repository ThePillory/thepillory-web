# Temporary: checks Congress.gov's committee bill lists. Removed after use.
name: Probe committee bills
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/probe/committee.py, .github/workflows/probe-committee.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/committee.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/probe/out
          git commit -m "Probe samples" && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done || true
