# Temporary: checks FEC Schedule A, Form 9 and ProPublica's Nonprofit Explorer. Removed after use.
name: Probe dark money sources
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/probe/darkmoney.py, .github/workflows/probe-darkmoney.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/probe/darkmoney.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tools/probe/out
          git commit -m "Probe samples" && for i in 1 2 3 4; do git pull --rebase && git push && break; sleep 7; done || true
