# Rebuilds data/ca-campaign.json (campaign finance for California's statewide
# officers and every legislative candidate since 2025: committees, statement
# totals, contributions by industry and employer, organizations, and Form 496
# independent expenditures) from the Secretary of State's Cal-Access export and
# commits it, then loads California lobbying reports from the same export into
# D1 (tools/load_ca_lobbying.py), weekly and on demand (Actions -> Refresh
# California campaign data -> Run workflow). See tools/build_ca_campaign.py and
# tools/ca_campaign_finish.mjs. The sync Worker loads the file when it changes. Cal-Access is replaced by CARS after the November 2026
# election; this workflow then needs the new system's data access.
name: Refresh California campaign data
on:
  schedule:
    - cron: "17 14 * * 1"  # Mondays; Cal-Access's export is rebuilt nightly
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # TEMPORARY probe (removed before the PR): how 2026 measure committees appear.
      - run: python3 tools/probe_measures.py /tmp/cabuild
