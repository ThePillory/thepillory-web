# Temporary: a measure run of tools/load_gov_money.py (reads, writes nothing). Removed after use.
name: Probe government money sources
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/load_gov_money.py, tools/govmoney.py, .github/workflows/probe-govmoney.yml]
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        what: [earmarks, travel, fara]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && python3 -m pip install -q openpyxl==3.1.5
      - run: python3 tools/load_gov_money.py ${{ matrix.what }} --mode measure --max-docs 40
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
