# TEMPORARY probe (removed before merge): the Cloudflare usage report, the published prices and the Pages project's flags.
name: Probe Cloudflare usage
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-usage.yml, probe/d1_probe.mjs, tools/time_page.mjs, functions/_lib/data.js, functions/votes/index.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: D1 facts and page costs (read-only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --import ./workers/sync/test/sql-stub.mjs tools/time_page.mjs /votes/ "/votes/?level=federal" /calaveras/ /ballot/ca/ /briefing/ > probe/pages-after.md 2>&1 || true
          cat probe/pages-after.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe && git commit -m "probe: pages after" && git push
