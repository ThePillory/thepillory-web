# Candidate pages' data (data/candidates/<year>/<st>.json): FEC totals,
# contributions from PACs and other committees (organizations by name; never
# individual donors) and the campaign website from each candidate's Form 1.
# Candidates come from data/elections/federal-<year>/ (the "Refresh election
# data" workflow). Each run reads the candidates read longest ago, within the
# FEC's hourly limit; see tools/build_candidates.mjs and docs/candidates.md. Weekly
# (Mondays), and twice a day in the 7 days after each FEC filing deadline (the gate job).
name: Refresh candidate data
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
# One at a time with every other workflow that commits data (tools/commit_data.sh).
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  # Is today a run day? (tools/schedule_gate.mjs, the rules in workers/sync/src/cadence.js;
  # docs/data-sync.md, "How often each source updates"). A run started by hand always runs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/schedule_gate.mjs
            workers/sync/src/cadence.js
            data/elections/dates.json
          sparse-checkout-cone-mode: false
      - id: gate
        run: node tools/schedule_gate.mjs candidates "${{ github.event_name }}" ${{ github.event.schedule == '17 19 * * *' && '--daily-only' || '' }}
  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the FEC
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: node tools/build_candidates.mjs --year 2026 --max-requests 800
      - name: Commit the data
        run: bash tools/commit_data.sh "Refresh candidate data from the FEC" data/candidates
