# TEMPORARY: research for executive order pages. Removed before merge.
name: tmp EO research
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/tmp/eo-research.mjs, .github/workflows/tmp-eo-research.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd workers/sync && npm ci
      - run: cp .github/tmp/eo-research.mjs workers/sync/eo-research.mjs && cd workers/sync && node eo-research.mjs
        env:
          CL: ${{ secrets.COURTLISTENER_API_TOKEN }}
