# TEMPORARY: research for the executive branch sources. Removed before merging.
name: TEMPORARY research (executive)
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch samples
        continue-on-error: true
        run: |
          UA="ThePillory research (+https://thepillory.co)"
          g() { curl -sSL -m 40 -A "$UA" "$@" || true; }
          cat > /tmp/txt.py <<'PY'
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style|nav|header|footer).*?</\1>','',t)
          t=re.sub(r'<[^>]+>','\n',t); t=html.unescape(t)
          print('\n'.join(l.strip() for l in t.splitlines() if l.strip()))
          PY
          txt() { python3 /tmp/txt.py 2>/dev/null; }
          echo "=== A whitehouse cabinet (main content)"; g https://www.whitehouse.gov/administration/cabinet/ > /tmp/cab.html; wc -c /tmp/cab.html; txt < /tmp/cab.html | sed -n '/^The Cabinet$/,$p' | head -200
          echo "=== A2 cabinet html structure sample"; grep -o '<h[2-4][^>]*>[^<]*</h[2-4]>' /tmp/cab.html | head -80
          echo "=== B congress bills updated recently with veto"; for off in 0 250 500 750; do g "https://api.congress.gov/v3/bill/119?api_key=DEMO_KEY&format=json&limit=250&offset=$off&sort=updateDate+desc" | jq -c '.bills[] | select(.latestAction.text|test("eto|without signature";"i")) | {type,number,la:.latestAction}'; done
          echo "=== B2 fromDateTime param"; g "https://api.congress.gov/v3/bill/119?api_key=DEMO_KEY&format=json&limit=2&fromDateTime=2026-09-30T00:00:00Z&toDateTime=2026-10-01T00:00:00Z" | jq -c '{count: .pagination.count, b: [.bills[]|{type,number,updateDate,la:.latestAction.text}]}'
          echo "=== C leginfo history AB 1..60 (governor lines)"; for n in $(seq 1 60); do h=$(g "https://leginfo.legislature.ca.gov/faces/billHistoryClient.xhtml?bill_id=202520260AB$n" | txt | grep -iE "governor|chaptered|veto|without his signature|became law" | head -4 | tr '\n' '|'); [ -n "$h" ] && echo "AB $n: $h"; done
          echo "=== C2 leginfo status for a chaptered bill (first found)"
          echo "=== D gov feed item detail"; g https://www.gov.ca.gov/category/executive-orders/feed/ | python3 -c "
          import sys,re
          t=sys.stdin.read()
          items=t.split('<item>')[1:]
          print('items',len(items))
          print(items[1][:4000])"
          echo "=== D2 feed paged=40"; g "https://www.gov.ca.gov/category/executive-orders/feed/?paged=40" | grep -c '<item>'; g "https://www.gov.ca.gov/category/executive-orders/feed/?paged=40" | grep -o '<pubDate>[^<]*' | head -2
          echo "=== D3 EO post page links to PDF"; L=$(g https://www.gov.ca.gov/category/executive-orders/feed/ | grep -o '<link>https://www.gov.ca.gov/20[^<]*' | sed -n 2p | sed 's/<link>//'); echo $L; g "$L" | grep -oiE 'href="[^"]*(EO|executive-order|\.pdf)[^"]*"' | head -10
          echo "=== E FEC"; g "https://api.open.fec.gov/v1/candidate/P80001571/totals/?api_key=DEMO_KEY&cycle=2024&election_full=false" | head -c 1500; echo
          echo "=== F insurance commissioner"; g https://www.insurance.ca.gov/0500-about-us/ | txt | grep -i -B2 -A2 "commissioner" | head -30
          echo "=== F2 superintendent"; g https://www.cde.ca.gov/eo/ | txt | grep -i -B2 -A2 "superintendent" | head -30
          echo "=== F3 treasurer"; g https://www.treasurer.ca.gov/ | txt | grep -i "treasurer " | head -8
          echo "=== G Open States executive orgs"; g "https://v3.openstates.org/jurisdictions/ocd-jurisdiction/country:us/state:ca/government?include=organizations" | head -c 600; echo
