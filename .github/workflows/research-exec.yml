# TEMPORARY: research for the executive branch sources. Removed before merging.
name: TEMPORARY research (executive)
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch samples
        shell: bash {0}
        run: |
          UA="ThePillory research (+https://thepillory.co)"
          g() { curl -sSL -m 40 -A "$UA" "$@"; }
          cat > /tmp/txt.py <<'PY'
          import sys,re,html
          t=sys.stdin.read()
          t=re.sub(r'(?s)<(script|style|nav|header|footer).*?</\1>','',t)
          t=re.sub(r'<[^>]+>','\n',t); t=html.unescape(t)
          print('\n'.join(l.strip() for l in t.splitlines() if l.strip()))
          PY
          txt() { python3 /tmp/txt.py 2>/dev/null; }
          echo "=== A leginfo history AB 1 table html"; g "https://leginfo.legislature.ca.gov/faces/billHistoryClient.xhtml?bill_id=202520260AB1" > /tmp/h1.html; python3 - <<'PY'
          import re
          t=open('/tmp/h1.html').read()
          i=t.find('Approved by the Governor')
          print(t[i-1500:i+600])
          PY
          echo "=== A2 AB 7 (vetoed) history text"; g "https://leginfo.legislature.ca.gov/faces/billHistoryClient.xhtml?bill_id=202520260AB7" | txt | sed -n '/Date/,$p' | head -24
          echo "=== A3 SB 1-40 lines with 'without'"; for n in $(seq 1 120); do g "https://leginfo.legislature.ca.gov/faces/billHistoryClient.xhtml?bill_id=202520260SB$n" | txt | grep -i "without\|pocket\|override\|Chaptered by Secretary of State - Res" | head -2 | sed "s/^/SB $n: /"; done
          echo "=== B gov EO post page"; L=https://www.gov.ca.gov/2026/09/18/governor-newsom-issues-executive-order-to-accelerate-independent-oversight-and-advance-the-creation-of-an-ai-kill-switch/; g "$L" > /tmp/p.html; grep -oiE 'href="[^"]+"' /tmp/p.html | grep -iE 'pdf|EO|N-[0-9]' | head -10; txt < /tmp/p.html | grep -iE "executive order|N-[0-9]+-[0-9]+" | head -8
          echo "=== B2 feed pages"; for p in 2 5 10 20 30; do echo "page $p: $(g "https://www.gov.ca.gov/category/executive-orders/feed/?paged=$p" | grep -c '<item>') items, $(g "https://www.gov.ca.gov/category/executive-orders/feed/?paged=$p" | grep -o '<pubDate>[^<]*' | tail -1)"; done
          echo "=== B3 EO list page on gov.ca.gov"; g https://www.gov.ca.gov/executive-orders/ | txt | head -40
          echo "=== C FEC"; g "https://api.open.fec.gov/v1/candidate/P80001571/totals/?api_key=DEMO_KEY&cycle=2026&election_full=false" | head -c 1200; echo; g "https://api.open.fec.gov/v1/candidate/P80001571/committees/?api_key=DEMO_KEY&designation=P&cycle=2026" | head -c 600; echo
          echo "=== D insurance"; for u in https://www.insurance.ca.gov/0500-about-us/ https://www.insurance.ca.gov/0400-news/ https://www.insurance.ca.gov/; do g "$u" | txt | grep -iE "commissioner [A-Z]" | head -5; done
          echo "=== D2 superintendent"; for u in https://www.cde.ca.gov/eo/ https://www.cde.ca.gov/eo/in/ https://www.cde.ca.gov/; do g "$u" | txt | grep -iE "superintendent [A-Z]|state superintendent" | head -6; done
          echo "=== D3 treasurer + controller"; g https://www.treasurer.ca.gov/ | txt | grep -iE "^Treasurer [A-Z]|Fiona" | head -3; g https://www.sco.ca.gov/ | txt | grep -i "cohen" | head -3
          echo "=== E cabinet html around a name"; g https://www.whitehouse.gov/administration/cabinet/ > /tmp/cab.html; python3 - <<'PY'
          t=open('/tmp/cab.html').read()
          i=t.find('Secretary of the Treasury')
          print(t[i-900:i+300])
          PY
