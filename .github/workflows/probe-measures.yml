# Temporary, while the state measure builders are written: runs
# tools/build_state_measures.py on pushes to the working branch and commits what
# it writes there, so the output can be checked before it's merged.
name: Probe measure guides
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [tools/build_state_measures.py, .github/workflows/probe-measures.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Build
        id: build
        continue-on-error: true
        run: python3 tools/build_state_measures.py
      - name: Commit what was written
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elections
          git diff --cached --quiet && exit 0
          git commit -m "State ballot measures from official sources (branch check)"
          git push
