name: Probe
on:
  push:
    branches: [claude/candidate-probe]
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null; python3 tools/build_certified_lists.py --states NJ,FL; for f in data/elections/certified-2026/*.json; do echo "FILE $f"; python3 -c "import json,sys;print(json.dumps(json.load(open(sys.argv[1])),ensure_ascii=False))" $f; done
