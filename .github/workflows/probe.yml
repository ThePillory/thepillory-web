name: Probe
on:
  push:
    branches: [claude/candidate-probe]
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null; python3 .github/probe/sample2.py
