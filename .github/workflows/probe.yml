name: Probe
on:
  push:
    branches: [claude/dark-money-probe]
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/probe/clairic_docs.py > probe-out.txt 2>&1; cat probe-out.txt
