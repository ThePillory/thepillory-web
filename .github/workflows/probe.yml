name: Probe
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe.yml, tools/accuracy_audit.py]
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd workers/sync
          q() { npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | python3 -c "import sys,json; [print(json.dumps(r)) for r in json.load(sys.stdin)[0]['results']]"; }
          q "SELECT st, session, bills, votes, substr(generated_at,1,10) g, substr(loaded_at,1,16) l FROM state_loads ORDER BY st, loaded_at"
          q "SELECT session, COUNT(*) n FROM bills WHERE id LIKE 'nj-%' GROUP BY session"
          q "SELECT b.session, COUNT(*) n, MAX(v.vote_date) newest FROM votes v JOIN bills b ON b.id = v.bill_id WHERE b.id LIKE 'nj-%' GROUP BY b.session"
