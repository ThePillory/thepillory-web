name: Probe
on:
  push:
    branches: [claude/candidate-probe]
permissions:
  contents: write
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null; python3 tools/build_certified_lists.py --states NJ,FL
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elections/certified-2026 && git commit -qm "Probe output: NJ, FL certified lists" && git push
