name: Probe
on:
  push:
    branches: [claude/candidate-probe]
jobs:
  q:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd workers/sync
          q() { npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | python3 -c "import sys,json; [print(json.dumps(r)) for r in json.load(sys.stdin)[0]['results']]"; }
          q "SELECT st, SUM(lookups) n FROM state_interest WHERE day >= date('now', '-90 days') GROUP BY st ORDER BY n DESC LIMIT 20"
          q "SELECT substr(value, 1, 400) v FROM sync_state WHERE key = 'state_priority'"
          q "SELECT name FROM sqlite_master WHERE name LIKE 'ballot_lookups%'"
          q "SELECT * FROM ballot_lookups ORDER BY rowid DESC LIMIT 3" || true
