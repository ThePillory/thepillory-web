# TEMPORARY: load live pages in Chromium; time the load event and list slow requests. Remove before merging.
name: TEMP live head check
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-live-head.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium >/dev/null
      - run: |
          cat > t.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            for (const u of ['https://thepillory.co/', 'https://thepillory.co/reps/', 'https://thepillory.co/explore/ca/']) {
              const ctx = await b.newContext(); const p = await ctx.newPage();
              const pending = new Map(); const done = [];
              p.on('request', r => pending.set(r, Date.now()));
              p.on('requestfinished', r => { done.push([r.url(), Date.now() - pending.get(r)]); pending.delete(r); });
              p.on('requestfailed', r => { done.push([r.url() + ' FAILED ' + (r.failure() || {}).errorText, Date.now() - pending.get(r)]); pending.delete(r); });
              p.on('console', m => console.log('  console:', m.type(), m.text().slice(0, 200)));
              p.on('pageerror', e => console.log('  pageerror:', e.message));
              const t0 = Date.now(); let loaded = 'no load event in 30s';
              try { await p.goto(u, { waitUntil: 'load', timeout: 30000 }); loaded = (Date.now() - t0) + 'ms'; } catch (e) {}
              console.log('==== ' + u + '  load: ' + loaded);
              console.log('  icon links:', JSON.stringify(await p.$$eval('link[rel~="icon"],link[rel="apple-touch-icon"]', ls => ls.map(l => l.rel + ' ' + l.href))));
              console.log('  link/meta count in body (misplaced?):', await p.$$eval('body link[rel~="icon"]', l => l.length));
              for (const [url, ms] of done.sort((a, b) => b[1] - a[1]).slice(0, 8)) console.log('  ', ms + 'ms', url.slice(0, 140));
              for (const [r] of pending) console.log('   STILL PENDING', r.url().slice(0, 140));
              const icon = await p.evaluate(async () => { const r = await fetch('/assets/logo/icon.svg?v=2'); return r.status + ' ' + r.headers.get('content-type'); });
              console.log('  icon fetch:', icon);
              await ctx.close();
            }
            await b.close();
          })();
          JS
          node t.js
