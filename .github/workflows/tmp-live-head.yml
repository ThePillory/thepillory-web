# TEMPORARY: load live pages in WebKit (Safari's engine); time the load event and list slow requests. Remove before merging.
name: TEMP live head check
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-live-head.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps webkit chromium >/dev/null
      - run: |
          cat > t.js <<'JS'
          const pw = require('playwright');
          (async () => {
            for (const engine of ['webkit', 'chromium']) {
              const b = await pw[engine].launch();
              for (const u of ['https://thepillory.co/', 'https://thepillory.co/?x=1', 'https://thepillory.co/reps/', 'https://thepillory.co/explore/', 'https://thepillory.co/place/ca/calaveras/']) {
                const ctx = await b.newContext(); const p = await ctx.newPage();
                const pending = new Map(); const done = [];
                p.on('request', r => pending.set(r, Date.now()));
                p.on('requestfinished', r => { done.push([r.url(), Date.now() - pending.get(r)]); pending.delete(r); });
                p.on('requestfailed', r => { done.push([r.url() + ' FAILED ' + (r.failure() || {}).errorText, Date.now() - pending.get(r)]); pending.delete(r); });
                p.on('pageerror', e => console.log('  pageerror:', e.message));
                const t0 = Date.now(); let loaded = 'NO LOAD EVENT IN 30s';
                try { await p.goto(u, { waitUntil: 'load', timeout: 30000 }); loaded = (Date.now() - t0) + 'ms'; } catch (e) { loaded += ' (' + e.message.split('\n')[0] + ')'; }
                console.log(`==== ${engine} ${u}  load: ${loaded}`);
                console.log('  frames:', p.frames().map(f => f.url().slice(0, 90)).join(' | '));
                for (const [url, ms] of done.sort((a, b) => b[1] - a[1]).slice(0, 6)) console.log('   ', ms + 'ms', url.slice(0, 130));
                for (const [r, t] of pending) console.log('    STILL PENDING after', (Date.now() - t) + 'ms', r.url().slice(0, 130));
                await ctx.close();
              }
              await b.close();
            }
          })();
          JS
          node t.js
