# Rebuilds data/history/ (the Time Machine's officeholders, district lines by
# period, and federal and California finances) from official sources. See
# tools/build_history.py and docs/history.md. Weekly, and on demand
# (Actions -> Refresh history data -> Run workflow).
name: Refresh history data
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null && pip install -q openpyxl xlrd
      - name: Build from official sources
        run: python3 tools/build_history.py
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet && exit 0
          git commit -m "Refresh history data from official sources"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
