# TEMPORARY: fetch the official voter guide pages for review (removed before merge).
name: TEMPORARY fetch voter guide
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-fetch-guide.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-guide
          UA="ThePillory/1.0 (+https://thepillory.co; civic records)"
          curl -sSL -A "$UA" https://voterguide.sos.ca.gov/propositions/ -o tmp-guide/index.htm
          for n in $(grep -oE '/propositions/[0-9]+/' tmp-guide/index.htm | grep -oE '[0-9]+' | sort -un); do
            for p in "" analysis.htm arguments-rebuttals.htm; do
              curl -sSL -A "$UA" "https://voterguide.sos.ca.gov/propositions/$n/$p" -o "tmp-guide/$n-${p:-index.htm}"
              sleep 1
            done
          done
          ls -la tmp-guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-guide
          git commit -m "TEMPORARY: official voter guide pages for review"
          git push
