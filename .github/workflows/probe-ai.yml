# Temporary read-only probe: executive order analyses. Removed after.
name: Probe order analyses
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/sync
        run: |
          x() { echo "=== $1"; npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const j=JSON.parse(d.slice(d.indexOf("[")));for(const r of j[0].results)console.log(Object.values(r).join(" | "))})'; }
          x "SELECT substr(id,1,instr(id,':')) AS src, COUNT(*) FROM executive_actions GROUP BY 1"
          x "SELECT substr(a.bill_id,1,instr(a.bill_id,':')) AS src, a.status, a.ai_review, a.depth, COUNT(*) FROM bill_analyses a WHERE a.current = 1 AND a.bill_id IN (SELECT id FROM executive_actions) GROUP BY 1,2,3,4"
          x "SELECT outcome, trigger, COUNT(*), MAX(created_at) FROM analysis_resolutions GROUP BY 1,2"
          x "SELECT step, status, substr(message,1,260), started_at FROM sync_log WHERE step IN ('analysis-orders','analysis-resolve') AND started_at >= '2026-11-08' ORDER BY id DESC LIMIT 14"
          x "SELECT a.bill_id, substr(a.ai_review_detail,1,500) FROM bill_analyses a WHERE a.current = 1 AND a.ai_review = 'flag' AND a.bill_id IN (SELECT id FROM executive_actions) ORDER BY a.id DESC LIMIT 5"
