# Temporary read-only probe: flagged drafts from October on. Removed after.
name: Probe analysis dates
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/sync
        run: |
          x() { echo "=== $1"; npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d.slice(d.indexOf("[")));for(const r of j[0].results)console.log(Object.values(r).join(" | "))}catch(e){console.log(d.slice(0,600))}})' || true; }
          W="(SELECT MAX(v.vote_date) FROM votes v WHERE v.bill_id = a.bill_id AND v.vote_type = 'final_passage')"
          x "SELECT CASE WHEN x.id IS NOT NULL THEN 'order' WHEN a.bill_id LIKE 'measure:%' THEN 'measure' ELSE 'bill' END k, COUNT(*) FROM bill_analyses a LEFT JOIN executive_actions x ON x.id = a.bill_id WHERE a.current = 1 AND a.status = 'ai_draft' AND a.ai_review = 'flag' AND COALESCE(x.signed_on, x.published_on, $W, substr(a.created_at, 1, 10)) >= '2026-10-01' GROUP BY 1"
          x "SELECT COUNT(*) FROM bills b WHERE (SELECT MAX(v.vote_date) FROM votes v WHERE v.bill_id = b.id AND v.vote_type = 'final_passage') >= '2026-10-01'"
          x "SELECT COUNT(*) FROM executive_actions x WHERE x.kind = 'executive_order' AND COALESCE(x.signed_on, x.published_on) >= '2026-10-01'"
