# Temporary read-only probe: what happens to flagged drafts. Removed after.
name: Probe order analyses
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/sync
        run: |
          x() { echo "=== $1"; npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d.slice(d.indexOf("[")));for(const r of j[0].results)console.log(Object.values(r).join(" | "))}catch(e){console.log(d.slice(0,600))}})' || true; }
          x "SELECT started_at, status, substr(message, 1, 400) FROM sync_log WHERE step = 'analysis-resolve' ORDER BY id DESC LIMIT 15"
          x "SELECT outcome, trigger, COUNT(*), SUM(cost_cents) FROM analysis_resolutions GROUP BY 1, 2"
          x "SELECT key, value FROM sync_state WHERE key LIKE 'resolve_cents_%' ORDER BY key DESC LIMIT 5"
          x "SELECT started_at, step, status, substr(message,1,200) FROM sync_log WHERE started_at >= '2026-11-10' AND step LIKE 'analysis%' ORDER BY id DESC LIMIT 10"
