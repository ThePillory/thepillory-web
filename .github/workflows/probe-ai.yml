# Temporary read-only probe: did the resolution step fix flagged analyses today? Removed after.
name: Probe resolutions
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: workers/sync
        run: |
          x() { echo "=== $1"; npx --yes wrangler@4 d1 execute pillory --remote --json --command "$1" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d.slice(d.indexOf("[")));for(const r of j[0].results)console.log(Object.values(r).join(" | "))}catch(e){console.log(d.slice(0,600))}})' || true; }
          x "SELECT id, started_at, substr(message, 1, 60), length(message) FROM sync_log WHERE step = 'analysis-resolve' AND started_at >= '2026-11-10T11:00' ORDER BY id"
          x "SELECT substr(message, instr(message, '; review'), 220) FROM sync_log WHERE step = 'analysis-resolve' AND started_at >= '2026-11-10T11:16' AND message LIKE '%withheld%' ORDER BY id DESC LIMIT 3"
