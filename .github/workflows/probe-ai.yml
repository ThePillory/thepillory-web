# Temporary read-only probe: the Federal Reserve's Distributional Financial Accounts downloads. Removed after.
name: Probe DFA downloads
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -A "Mozilla/5.0 (compatible; ThePillory data build)" -o /tmp/f.zip https://www.federalreserve.gov/releases/z1/dataviz/download/zips/dfa.zip
          mkdir -p /tmp/z && cd /tmp/z && unzip -o -q /tmp/f.zip
          cat dfa-data-definitions.txt; echo; cat dfa-general-levels-detail-dictionary.txt | head -40; echo
          for f in dfa-networth-levels.csv dfa-networth-shares.csv dfa-networth-levels-detail.csv; do echo "--- $f"; head -1 "$f"; cut -d, -f2 "$f" | sort | uniq -c; tail -6 "$f" | cut -c1-300; done
