# Temporary read-only probe of SEC EDGAR company facts. Removed after.
name: Probe SEC company facts
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          A="${UA:-ThePillory data probe contact@thepillory.co}"
          for f in "34088 000003408826000045" "1018724 000101872426000004" "21344 000162828026010047"; do
            set -- $f
            echo "== $1 $2"
            curl -s -A "$A" "https://www.sec.gov/Archives/edgar/data/$1/$2/index.json" | python3 -c "import json,sys;d=json.load(sys.stdin);print([x['name'] for x in d['directory']['item'] if x['name'].endswith(('.xml','.json','.xlsx'))])"
            x=$(curl -s -A "$A" "https://www.sec.gov/Archives/edgar/data/$1/$2/index.json" | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((x['name'] for x in d['directory']['item'] if x['name'].endswith('_htm.xml')),''))")
            sleep 0.3
            curl -s -A "$A" "https://www.sec.gov/Archives/edgar/data/$1/$2/$x" -o inst.xml; ls -la inst.xml
            grep -o '<[a-z-]*:[A-Za-z]*Tax[A-Za-z]*Paid[A-Za-z]*\|<[a-z-]*:[A-Za-z]*Paid[A-Za-z]*Tax[A-Za-z]*\|<[a-z-]*:IncomeTax[A-Za-z]*Jurisdiction[A-Za-z]*' inst.xml | sort | uniq -c | head -20
            grep -o 'dimension="[^"]*Tax[^"]*">[^<]*' inst.xml | sort | uniq -c | head -20
            sleep 0.3
          done
