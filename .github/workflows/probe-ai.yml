# Temporary read-only probe: email sending options' docs and pricing. Removed after.
name: Probe email providers
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { echo; echo "######## $1"; curl -sSL -A "Mozilla/5.0" --max-time 30 "$1" | python3 -c '
          import sys, re, html
          t = sys.stdin.read()
          t = re.sub(r"(?is)<(script|style|nav|header|footer)[^>]*>.*?</\1>", " ", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = re.sub(r"[ \t]+", " ", t)
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          keep = [l for l in lines if re.search(sys.argv[1], l, re.I)]
          print("\n".join(l[:400] for l in keep[:40]) or "(nothing matched; first lines:)\n" + "\n".join(lines[:15]))
          ' "$2"; }
          curl -sSL -A "Mozilla/5.0" https://developers.cloudflare.com/email-service/platform/limits/index.md | sed -n '/[Cc]ompliance/,/Need a higher/p' | head -40
          echo "########"; curl -sSL -A "Mozilla/5.0" https://developers.cloudflare.com/email-service/llms.txt | grep -iE "marketing|bulk|newsletter|transactional|unsubscribe|policy|acceptable" | head -20
          echo "########"; curl -sSL -A "Mozilla/5.0" https://developers.cloudflare.com/email-service/platform/limits/index.md | grep -iE "per second|per day|daily|new accounts|marketing|bulk|unsubscribe|list-unsubscribe" | head -20
          get https://resend.com/pricing "marketing|broadcast|contacts|\\$[0-9]+|emails ?/ ?mo|50,000|100,000"
