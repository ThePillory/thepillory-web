# Temporary: the company taxes reader in measure mode on real EDGAR data (writes nothing). Removed after.
name: Probe SEC company facts
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install -q pycountry==24.6.1 && python3 tools/test_company_taxes.py
      - run: python3 tools/build_company_taxes.py --mode measure --max-instances 40 --limit 0
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
