# Temporary read-only probe: the duplicate California Constitution sections. Removed after.
name: Probe CA constitution duplicates
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import sys, re
          sys.path.insert(0, "tools")
          import build_ca_constitution as b
          from pathlib import Path
          z = Path("/tmp/pubinfo.zip")
          b.download(b.latest_snapshot(), z)
          rows, zf = b.read_snapshot(z)
          names = {n.lower(): n for n in zf.namelist()}
          want = {("XIII", "36"), ("XVI", "20"), ("XVI", "22")}
          for r in rows:
              art = b.article_of(r["article"])
              num = re.sub(r"^(?:SEC(?:TION)?\.?\s*)", "", r["section_num"].strip(), flags=re.I).rstrip(".").strip()
              if (art, num) in want:
                  lob = r["content_xml"]; name = names.get(lob.lower()) or next((names[n] for n in names if n.endswith(lob.lower())), None)
                  text = b.section_text(zf.read(name).decode("utf-8","replace")) if name else ""
                  print("====", art, num, "| active", r["active_flg"], "| op", r["op_statues"], r["op_chapter"], r["op_section"], "| eff", r["effective_date"], "| id", r["id"])
                  print("  history:", r["history"])
                  print("  text:", text[:300].replace("\n"," / "))
          PY
