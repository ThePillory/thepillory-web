# Temporary: build data/taxes/taxpayers.json once, printed for review. Removed after.
name: Probe SEC company facts
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && python3 -m pip install -q openpyxl==3.1.5 xlrd==2.0.1
      - run: python3 tools/build_taxpayers.py || true
      - run: echo "BEGIN64"; gzip -9c data/taxes/taxpayers.json | base64 -w0; echo; echo "END64"
