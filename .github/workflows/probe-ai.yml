# Temporary: build data/taxes/wealth.json on this branch once. Removed after.
name: Build wealth data on branch
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/probe-ai.yml]
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  wealth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_build_wealth.py
      - run: python3 tools/build_wealth.py
      - run: python3 -c "import json; d=json.load(open('data/taxes/wealth.json')); print(d['latest']); [print(g) for g in d['groups']]"
      - run: head -1 /dev/null; python3 - <<'PY'
          import io, zipfile, urllib.request
          z = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(urllib.request.Request("https://www.federalreserve.gov/releases/z1/dataviz/download/zips/dfa.zip", headers={"User-Agent": "Mozilla/5.0"})).read()))
          n = [x for x in z.namelist() if x.endswith("dfa-networth-levels-detail.csv")][0]
          print(z.read(n).decode().splitlines()[0])
          PY
      - run: bash tools/commit_data.sh "Build who holds household wealth from the Federal Reserve's accounts" data/taxes/wealth.json
