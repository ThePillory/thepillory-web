# The U.S. Supreme Court from official sources: the justices (supremecourt.gov,
# senate.gov), each term's decisions with their lineups and the constitutional
# provisions they name (supremecourt.gov opinions), this term's cases and
# questions presented, and the justices' financial disclosures (CourtListener bulk data).
# Writes data/scotus/ with tools/build_scotus.py and commits it when it changes. Daily
# October – June (the Court's term), weekly (Mondays) July – September: the gate job.
name: Refresh Supreme Court data
on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      max_pdfs:
        description: Opinion PDFs to read this run (the rest wait for the next)
        default: "150"
permissions:
  contents: write
# One at a time with every other workflow that commits data (tools/commit_data.sh).
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  # Is today a run day? (tools/schedule_gate.mjs, the rules in workers/sync/src/cadence.js;
  # docs/data-sync.md, "How often each source updates"). A run started by hand always runs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/schedule_gate.mjs
            workers/sync/src/cadence.js
            data/elections/dates.json
          sparse-checkout-cone-mode: false
      - id: gate
        run: node tools/schedule_gate.mjs scotus "${{ github.event_name }}"
  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Build from official sources
        run: python3 tools/build_scotus.py --max-pdfs "${{ inputs.max_pdfs || '150' }}" --max-questions 150
      - name: Commit the data
        run: bash tools/commit_data.sh "Refresh Supreme Court data from official sources" data/scotus
