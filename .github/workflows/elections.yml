# Rebuilds data/elections/<date>.json (contests, candidates, ballot measures,
# candidate statements and arguments) from official sources only: the
# California Secretary of State, county elections offices and the FEC; and
# Washington's statewide measures from its Secretary of State, and Colorado's,
# Arizona's, Florida's, Michigan's and North Carolina's (with its Judicial Voter
# Guide) from their official documents. See
# tools/build_elections.py, tools/build_wa_measures.py,
# tools/build_state_measures.py and docs/elections.md. Daily from 60 days before an election
# until it is certified, weekly (Mondays) otherwise (the gate job), and on demand (Actions -> Refresh election data -> Run workflow).
name: Refresh election data
on:
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
# One at a time with every other workflow that commits data (tools/commit_data.sh).
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  # Is today a run day? (tools/schedule_gate.mjs, the rules in workers/sync/src/cadence.js;
  # docs/data-sync.md, "How often each source updates"). A run started by hand always runs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/schedule_gate.mjs
            workers/sync/src/cadence.js
            data/elections/dates.json
          sparse-checkout-cone-mode: false
      - id: gate
        run: node tools/schedule_gate.mjs elections "${{ github.event_name }}"
  build:
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.run == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Build from official sources
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 tools/build_elections.py
      - name: Washington's statewide measures (Secretary of State, Attorney General, Office of Financial Management)
        run: python3 tools/build_wa_measures.py
      # One state's guide failing to read keeps its earlier file; the others still update. The run is marked failed at the end.
      - name: Colorado's, Arizona's, Florida's, Michigan's and North Carolina's statewide measures (official documents)
        id: states
        continue-on-error: true
        run: python3 tools/build_state_measures.py
      # A failure here (an FEC outage) still lets the steps above commit; the run is marked failed at the end.
      - name: Every state's federal races (FEC filings, for Open your ballot)
        id: fec
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 tools/build_federal_races.py
      # Each state's own certified candidate list for the U.S. Senate and House (North Carolina,
      # New Jersey, Florida). A state that doesn't read keeps its earlier file.
      - name: States' certified candidate lists (tools/build_certified_lists.py)
        id: certified
        continue-on-error: true
        run: python3 tools/build_certified_lists.py
      - name: Commit the data
        run: bash tools/commit_data.sh "Refresh election data from official sources" data/elections
      - name: Fail the run if the federal races, a state's measures or a certified list didn't build
        if: steps.fec.outcome == 'failure' || steps.states.outcome == 'failure' || steps.certified.outcome == 'failure'
        run: exit 1
