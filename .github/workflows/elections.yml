# Rebuilds data/elections/<date>.json (contests, candidates, ballot measures,
# candidate statements and arguments) from official sources only: the
# California Secretary of State, county elections offices and the FEC; and
# Washington's statewide measures from its Secretary of State. See
# tools/build_elections.py, tools/build_wa_measures.py and docs/elections.md. Daily during election season,
# and on demand (Actions -> Refresh election data -> Run workflow).
name: Refresh election data
on:
  schedule:
    - cron: "41 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Build from official sources
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 tools/build_elections.py
      - name: Washington's statewide measures (Secretary of State, Attorney General, Office of Financial Management)
        run: python3 tools/build_wa_measures.py
      # A failure here (an FEC outage) still lets the steps above commit; the run is marked failed at the end.
      - name: Every state's federal races (FEC filings, for Open your ballot)
        id: fec
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python3 tools/build_federal_races.py
      - name: Commit the data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/elections
          git diff --cached --quiet && exit 0
          git commit -m "Refresh election data from official sources"
          git push
      - name: Fail the run if the federal races didn't build
        if: steps.fec.outcome == 'failure'
        run: exit 1
