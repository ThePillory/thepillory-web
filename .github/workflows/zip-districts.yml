# Rebuilds the ZIP code lookup data (data/zip/, data/counties.json,
# data/states/district-names/) from
# Census Bureau files and commits it. Run it by hand (Actions -> Refresh ZIP
# district data -> Run workflow), e.g. when the 120th Congress's district
# files are published. See tools/build_zip_districts.py.
name: Refresh ZIP district data
on:
  workflow_dispatch:
permissions:
  contents: write
# One at a time with every other workflow that commits data (tools/commit_data.sh).
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_zip_districts.py /tmp/zipbuild
      - name: Commit the data
        run: bash tools/commit_data.sh "Refresh ZIP district data from Census Bureau files" data/zip data/counties.json data/states/district-names
