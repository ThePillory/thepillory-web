# Company taxes from SEC EDGAR (XBRL company facts, and each 10-K's own XBRL for
# taxes paid by jurisdiction) into D1, weekly and on demand (Actions -> Refresh
# company taxes -> Run workflow). See tools/build_company_taxes.py and docs/taxes.md.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (D1), SEC_USER_AGENT
# (optional: "Name email@example.org"; EDGAR asks for a contact).
name: Refresh company taxes
on:
  schedule:
    - cron: "43 16 * * 6"  # Saturdays
  workflow_dispatch:
    inputs:
      mode:
        description: "measure (read, write nothing) or load"
        default: load
      max_instances:
        description: "10-K XBRL instances read this run for taxes paid by jurisdiction"
        default: "6000"
permissions:
  contents: read
concurrency:
  group: company-taxes
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install -q pycountry==24.6.1
      - run: python3 tools/test_company_taxes.py
      - run: python3 tools/build_company_taxes.py --mode "${{ github.event.inputs.mode || 'load' }}" --max-instances "${{ github.event.inputs.max_instances || '6000' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
