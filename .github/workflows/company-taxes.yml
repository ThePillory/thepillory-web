# Company taxes from SEC EDGAR (XBRL company facts, and each 10-K's own XBRL for
# taxes paid by jurisdiction) into D1, who pays taxes (IRS Statistics of Income,
# California's Franchise Tax Board) into data/taxes/taxpayers.json, and who holds
# household wealth (the Federal Reserve's Distributional Financial Accounts) into
# data/taxes/wealth.json, weekly and on
# demand (Actions -> Refresh company taxes -> Run workflow). See
# tools/build_company_taxes.py, tools/build_taxpayers.py and docs/taxes.md.
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (D1), SEC_USER_AGENT
# (optional: "Name email@example.org"; EDGAR asks for a contact).
name: Refresh company taxes
on:
  schedule:
    - cron: "43 16 * * 6"  # Saturdays
  workflow_dispatch:
    inputs:
      mode:
        description: "measure (read, write nothing) or load"
        default: load
      top:
        description: "keep the N largest companies by revenue (0: every company)"
        default: "100"
      max_instances:
        description: "10-K XBRL instances read this run for taxes paid by jurisdiction"
        default: "6000"
permissions:
  contents: read
jobs:
  taxpayers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    # One at a time with every other workflow that commits data (tools/commit_data.sh).
    concurrency:
      group: data-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null && python3 -m pip install -q openpyxl==3.1.5 xlrd==2.0.1
      - run: python3 tools/test_build_taxpayers.py && python3 tools/test_build_wealth.py
      - name: Read the official tables
        id: build
        continue-on-error: true
        run: python3 tools/build_taxpayers.py
      - name: Read the Federal Reserve's wealth accounts
        id: wealth
        continue-on-error: true
        run: python3 tools/build_wealth.py
      - name: Commit the data
        run: bash tools/commit_data.sh "Refresh who pays taxes and who holds wealth from IRS, FTB and Federal Reserve tables" data/taxes/taxpayers.json data/taxes/wealth.json
      - name: Fail the run if a source didn't read (its last good data was kept)
        if: steps.build.outcome == 'failure' || steps.wealth.outcome == 'failure'
        run: exit 1
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: company-taxes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m pip install -q pycountry==24.6.1
      - run: python3 tools/test_company_taxes.py
      - run: python3 tools/build_company_taxes.py --mode "${{ github.event.inputs.mode || 'load' }}" --max-instances "${{ github.event.inputs.max_instances || '6000' }}" --top "${{ github.event.inputs.top || '100' }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
