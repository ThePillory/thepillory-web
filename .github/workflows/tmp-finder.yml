# TEMPORARY: research for the issues-page finder (removed before merge).
name: TEMPORARY finder research
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/tmp/finder-research.mjs, .github/workflows/tmp-finder.yml, workers/sync/src/promises/finder.js]
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node .github/tmp/finder-research.mjs
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
