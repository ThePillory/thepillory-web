# TEMPORARY: checks outside services for the hub (the dev sandbox can't reach
# them). Removed before the PR is merged.
name: Research hub services
on:
  push:
    paths: [".github/workflows/research-hub.yml", "tools/research_hub.sh"]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/research_hub.sh
