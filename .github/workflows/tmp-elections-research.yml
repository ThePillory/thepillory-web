# TEMPORARY: map the official election sources. Removed before merge.
name: TEMPORARY elections research
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-elections-research.yml, .github/tmp/elections_probe.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - env:
          FEC_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python3 .github/tmp/elections_probe.py
