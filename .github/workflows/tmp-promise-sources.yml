# TEMPORARY: research which official sources expose press releases, addresses and minutes. Removed before merge.
name: TEMPORARY promise sources research
on:
  push:
    branches: [claude/pillory-mobile-screens-p5zekn]
    paths: [.github/workflows/tmp-promise-sources.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe govinfo DCPD
        run: |
          K=DEMO_KEY
          curl -s "https://api.govinfo.gov/collections/CPD/2025-01-01T00:00:00Z?offsetMark=*&pageSize=1000&api_key=$K" > /tmp/c.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/c.json'))
          print('count', d.get('count'), 'keys', list(d.keys()), 'next', bool(d.get('nextPage')))
          pk=d.get('packages',[])
          print('first', pk[:2])
          for p in pk:
              if re.search(r'joint session|state of the union|inaugural', p.get('title',''), re.I): print(' ', p['packageId'], p.get('dateIssued'), p['title'][:120], p.get('packageLink'))
          PY
          ID=$(python3 -c "import json,re; d=json.load(open('/tmp/c.json')); print(next((p['packageId'] for p in d.get('packages',[]) if re.search(r'joint session',p.get('title',''),re.I)),''))")
          echo "package $ID"
          curl -s "https://api.govinfo.gov/packages/$ID/summary?api_key=$K" | python3 -c "import json,sys; d=json.load(sys.stdin); print({k:d.get(k) for k in ['title','dateIssued','packageId','download','detailsLink','documentType','subject','category']})"
          curl -s -o /tmp/p.htm -w "htm %{http_code} %{size_download}\n" "https://api.govinfo.gov/packages/$ID/htm?api_key=$K"
          python3 -c "import re; t=open('/tmp/p.htm',encoding='utf-8',errors='replace').read(); print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',t))[:600])"
